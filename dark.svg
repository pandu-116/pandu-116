      .ascii { font: 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #22D3EE; letter-spacing: 1px; }
      .pill { font: 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #F8FAFC; }
      .project-name { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #F8FAFC; }
      .project-desc { font: 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #94A3B8; }
    </style>
  </defs>

