      .label { font: 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 1.5px; fill: #94A3B8; }
      .value { font: 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #F8FAFC; }
      .headline { font: 700 20px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #F8FAFC; }
